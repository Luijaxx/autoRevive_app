<div @fadeIn class="p-10 container mx-auto ">
    <!-- Comboboxes -->
    <div class="flex items-center justify-between mb-4">
      <div>
        <h2 class="text-xl font-semibold">Invoices</h2>
      </div>
      <div>
       
        
      </div>
    </div>
  
    <div class="mb-4 flex gap-4">
  
       <!-- Year Selector -->
       <div class="relative">
        <label class="block text-gray-700">Select Year</label>
        <select
          (change)="onYearChange($event)"
          class="block appearance-none w-full bg-white border border-gray-400 hover:border-gray-500 px-4 py-2 pr-8 rounded shadow leading-tight focus:outline-none focus:shadow-outline"
        >      
        <option value="" disabled selected>Select Year</option>
  
          <option *ngFor="let year of years" [value]="year">
            {{ year }}
          </option>
        </select>
      </div>
     
  
      <!-- Month Selector -->
      <div class="relative">
        <label class="block text-gray-700">Select Month</label>
        <select
          (change)="onMonthChange($event)"
          class="block appearance-none w-full bg-white border border-gray-400 hover:border-gray-500 px-4 py-2 pr-8 rounded shadow leading-tight focus:outline-none focus:shadow-outline"
        >
        <option value="" disabled selected>Select Month</option>
  
          <option *ngFor="let month of months" [value]="month.value">
            {{ month.name }}
          </option>
        </select>
      </div>
  
      <div class="relative">
        <label class="block text-gray-700">Filter by Client Name</label>
        <input
          type="text"
          (input)="onClientNameChange($event)"
          class="block w-full bg-white border border-gray-400 hover:border-gray-500 px-4 py-2 rounded shadow leading-tight focus:outline-none focus:shadow-outline"
          placeholder="Enter client name"
        />
      </div>
  
      <!-- Apply Filter Button -->
      <button
      (click)="updateCalendar()"
      class="bg-green-500 text-white rounded-full mt-5 text-center py-2 px-4 hover:bg-green-700 flex items-center justify-center"
      aria-label="Apply Filter"
      title="Apply Filter"
    >
      Apply
    </button>
    
    
    </div>
  
  
  <!-- Calendar Cards -->
  <div class="container mx-auto p-2">
    <!-- Calendar Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-6">
      <div
        *ngFor="let item of calendarDays"
        class="bg-white border border-gray-200 rounded-lg shadow-sm flex flex-col"
      >
        <div class="p-2 flex-2">
          <div class="text-lg font-semibold text-gray-900 mb-2">{{ item.date | date: 'MMMM d, y' }}</div>
          <div class="text-gray-700">
            <div *ngFor="let invoice of item.invoices">
              <div class="my-1">
                <span class="font-semibold">Date: </span>
                <span>{{ formatDate(invoice.date) }}</span>
              </div>
              <div class="mb-1">
                <span class="font-semibold">Client: </span>
                <span>{{ (invoice.user.name) }}</span>

              </div>
              <div class="mb-1">
                <span class="font-semibold">Total: </span>
                <span>{{ invoice.total | number:'1.2-2' }}</span>
              </div>
              
              <div class="mb-1">
                <span class="font-semibold">Branch: </span>
                <span>{{ (invoice.branch.name) }}</span>
              </div>
              <div
                class="px-4 py-2 text-white text-sm font-medium text-center flex justify-between items-center"
                [ngStyle]="{
'background-color': invoice.canceled == 'NO' ? '#83e309' : '#a9a9a9',
'border-radius': '0 0 0.5rem 0.5rem'
                }"
              >
                <span>{{ invoice.canceled == 'YES' ? 'Canceled' : 'Active' }}</span>
               
                <div class="flex space-x-2">
  
                  
                  <svg (click)="detail(invoice.id)" class="h-5 w-5 text-slate-100 rounded-full hover:bg-white"  fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
                  </svg>
                  
                </div>
  
  
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
    
  </div>
