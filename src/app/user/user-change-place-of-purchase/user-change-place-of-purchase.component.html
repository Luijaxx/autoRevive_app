<div class="container mx-auto p-4 flex justify-center">
    <div class="w-full max-w-lg bg-white rounded-lg shadow-lg p-6">
      <h2 class="text-2xl font-semibold mb-4 text-center">Change Place of Purchase</h2>
      <div *ngIf="currentUser.role === 'CLIENT'">
        <div class="mb-4">
          <label class="block text-gray-700">Current Branch:</label>
          <p class="text-gray-900">{{ currentBranch?.name }}</p>
        </div>
  
        <div class="mb-4">
          <label class="block text-gray-700">Select New Branch:</label>
          <select
            [(ngModel)]="selectedBranchId"
            class="block w-full mt-1 border-gray-300 rounded-md shadow-sm"
          >
            <option *ngFor="let branch of branches" [value]="branch.id">
              {{ branch.name }}
            </option>
          </select>
        </div>
  
        <button
          (click)="changeBranch()"
          class="bg-blue-500 text-white rounded-md px-4 py-2 hover:bg-blue-700 w-full"
        >
          Change Branch
        </button>
      </div>
  
      <div *ngIf="currentUser.role !== 'CLIENT'">
        <p class="text-red-600 text-center">You are not authorized to change the branch.</p>
      </div>
    </div>
  </div>
