<div @fadeIn class="mt-12 w-full bg-white rounded shadow">
    <!-- Card Title -->
    <div class="py-4 border-b p-8">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-xl font-semibold">Users</h2>
        </div>
        <div>
         
        </div>
      </div>
    </div>
  
    <div @fadeIn class="px-20">
      <hr class="mb-4" />
      <!-- Table -->
      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Phone</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Role</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
            </tr>
          </thead>
          <tbody class="bg-white divide-y divide-gray-200">
            <tr *ngFor="let row of paginatedData">
              <td class="px-6 py-4 whitespace-nowrap">{{ row.name }}</td>
              <td class="px-6 py-4 whitespace-nowrap">{{ row.email }}</td>
              <td class="px-6 py-4 whitespace-nowrap">{{ row.phone }}</td>
              <td class="px-6 py-4 whitespace-nowrap">
                <select
                  class="border border-gray-300 rounded px-2 py-1"
                  [(ngModel)]="row.role"
                  (change)="updateUserRole(row)"
                >
                  <option value="CLIENT">Client</option>
                  <option value="MANAGER">Manager</option>
                </select>
              </td>
              <td class="px-6 py-4 whitespace-nowrap">
                <button
                  class="bg-blue-500 text-white rounded-full p-2 hover:bg-blue-700"
                  aria-label="Update User"
                  title="Update User"
                  (click)="updateUserRole(row)"
                >
                  <svg
                    class="h-6 w-6 text-slate-100"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
                    />
                  </svg>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
        <!-- Paginator -->
        <div class="py-2 flex justify-between items-center">
          <div>
            <span class="text-sm text-gray-700"
              >Showing {{ paginatedData.length }} of
              {{ dataSource.data.length }}</span
            >
          </div>
          <div class="flex space-x-2">
            <button 
              class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300"
              (click)="previousPage()"
              [disabled]="currentPage === 1"
            >
              Previous
            </button>
            <button
              class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300"
              (click)="nextPage()"
              [disabled]="currentPage === totalPages"
            >
              Next
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
